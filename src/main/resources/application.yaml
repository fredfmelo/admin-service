    inventory-dlq: inventory-dlq

    notification-queue: notification-queue
    notification-dlq: notification-dlq

    order-completion-queue: order-completion-queue
    order-completion-dlq: order-completion-dlq

    order-state-queue: order-state-queue
    order-state-dlq: order-state-dlq

    payment-queue: payment-queue
    payment-dlq: payment-dlq
