spring:
  application:
    name: admin-service

server:
  port: 8084
  servlet:
    context-path: /api/admin-service/v1

aws:
  dynamodb:
    table-name: ADMIN

  sns:
    order-topic-arn: arn:aws:sns:us-east-1:200849340204:order-events
  sqs:
